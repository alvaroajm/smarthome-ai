<!DOCTYPE html>
<html lang="{{lang}}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="{{author}}">
  <meta name="robots" content="{{robots}}">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#080d0c">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SmartHome-AI — {{tagline_meta}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{og_image}}">
  <meta name="twitter:image:alt" content="SmartHome-AI — {{tagline_meta}}">

  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/img/logo-smarthome-ai-marca.png">
  <link rel="preload" href="/static/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{css_url}}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sha-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  {{extra_head}}
</head>
<body class="{{body_class}}"
      data-lang="{{lang_code}}"
      data-intl="{{intl}}"
      data-search-index="{{search_index}}"
      data-search-empty="{{ui_search_empty}}"
      data-search-none="{{ui_search_none}}"
      data-search-suggest="{{ui_search_suggest}}">
  <a class="skip-link" href="#conteudo">{{ui_skip}}</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  {{topbar}}

  {{header}}

  <main id="conteudo">
    {{content}}
  </main>

  {{footer}}

  <button class="to-top" id="to-top" type="button" aria-label="{{ui_to_top}}" title="{{ui_to_top}}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg>
  </button>

  <div class="search-modal" id="search-modal" hidden>
    <div class="search-backdrop" data-close></div>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="{{ui_search}}">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search-input" placeholder="{{ui_search_ph}}" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <ul class="search-results" id="search-results"></ul>
    </div>
  </div>

  <script src="{{js_url}}" defer></script>
</body>
</html>
