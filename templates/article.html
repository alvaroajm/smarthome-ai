<article class="page">
    <header class="page-head">
      <p class="eyebrow">{{category}}</p>
      <h1>{{title}}</h1>
      <p class="lead">{{description}}</p>
      <p class="byline">{{reading}}</p>
    </header>
    <div class="article-grid">
      {{toc}}
      <div class="prose">
        {{content}}
        {{tags}}
      </div>
    </div>
    <nav class="pager" aria-label="Navegação entre guias">
      {{prev}}
      {{next}}
    </nav>
  </article>
